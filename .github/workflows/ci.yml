name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, so a new bwoc release that breaks a documented command is caught
  # even when nothing changes here (cli-contract checks the latest release).
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: plugin structural smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `jq` is preinstalled on ubuntu-latest; shellcheck verifies the scripts.
      - name: Lint scripts
        # Gate on warning+error (real bugs); info-level style nits (e.g. SC2016
        # on intentional printf format strings) are advisory, not failures.
        run: shellcheck -S warning scripts/*.sh
      - name: Check formatting (Prettier)
        # Markdown is hand-formatted to the house README style and excluded via
        # .prettierignore; this gates JSON manifests so they stay canonical.
        run: npx --yes prettier@3 --check .
      - name: Structural smoke (validate.sh)
        # `bwoc` isn't on PATH in CI — validate.sh treats that as an advisory
        # warning (exit 0), since it gates structure, not the runtime CLI.
        run: bash scripts/validate.sh

  cli-contract:
    name: CLI contract (latest bwoc release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the latest bwoc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R bemindlabs/BWOC-Framework \
            --pattern '*-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/bwoc-*.tar.gz -C "$RUNNER_TEMP"
          echo "$(ls -d "$RUNNER_TEMP"/bwoc-*-x86_64-unknown-linux-gnu)" >> "$GITHUB_PATH"
      - name: every documented bwoc command parses
        # Each `bwoc …` line in commands/skills/agents runs as `<argv> --help`:
        # the CLI rejects an unknown subcommand or flag, nothing executes.
        run: python3 scripts/cli-contract.py
